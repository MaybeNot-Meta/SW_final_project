<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>직무 연결 · myfo</title>
    <!-- myfo 공통 디자인: 직무 연결 고유 스타일보다 먼저 로드 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="../../common/tokens.css">
    <link rel="stylesheet" href="../../common/base.css">
    <link rel="stylesheet" href="./job-connection.css">
    <!-- myfo 전체 공통 UI: 페이지별 CSS보다 나중에 적용 -->
  <link rel="stylesheet" href="../../common/unified-ui.css">
</head>
  <body>
    <div id="header"></div>
    <main class="jc-shell" data-job-connection aria-label="직무 연결"></main>
    <script src="./data/jobs.js"></script>
    <script src="./data/contests.js"></script>
    <script src="./data/missions.js"></script>
    <!-- myfo 공통 데이터 원본을 직접 읽습니다. 별도 저장소는 로드하지 않습니다. -->
    <script src="../../data/tags.js"></script>
    <script src="../../common/storage.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <!-- myfo 공통 헤더: 공통 데이터와 아이콘 로드 후 적용 -->
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="../../common/header.js"></script>
    <script src="./job-connection.js"></script>
    <script>
      // 팀원 모듈이 보내는 이동 이벤트를 통합 사이트의 실제 화면과 연결합니다.
      document.addEventListener("selfdev:navigate", (event) => {
        const detail = event.detail || {};
        if (detail.destination === "experience-extraction") {
          window.location.assign("../record/index.html?tab=extract");
        } else if (detail.destination === "portfolio-star") {
          // 화면에 근거 경험으로 표시된 첫 기록을 정확히 전달합니다.
          const evidence = getRecords().find(record => String(record.id) === String(detail.recordId || ""))
            || getRecords().find(record => Array.isArray(record.tags) && record.tags.includes(detail.tag));
          if (evidence) {
            window.location.assign(`../../portfolio/star.html?record=${encodeURIComponent(evidence.id)}`);
          }
        }
      });
      window.OPSJOB.mountJobConnection(
        document.querySelector("[data-job-connection]"),
        { getUser, getRecords, getTagCounts, saveUser }
      );
    </script>
  </body>
</html>
